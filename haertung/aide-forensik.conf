# ============================================================================
#  aide-forensik.conf  —  AIDE-Konfiguration für dauerhafte Datei-Integrität
# ============================================================================
#
#  ZWECK
#  Der Forensik-Scanner (wp_plesk_forensik.sh) liefert Momentaufnahmen und
#  referenzlose Heuristiken (ctime/Timestomp, dpkg -V, debsums). AIDE ergänzt
#  das um eine echte Baseline-Datenbank: einmal im sauberen Zustand angelegt,
#  meldet jeder spätere Lauf jede Änderung an den überwachten Systemdateien.
#
#  ⚠️  Eine Baseline ist nur aussagekräftig, wenn sie VOR einer Kompromittierung
#      erstellt wurde. Auf einem bereits verdächtigen System zeigt AIDE nur
#      Änderungen AB JETZT — nicht die zurückliegende Manipulation.
#
#  EINRICHTUNG (Debian/Ubuntu/Plesk)
#     apt install aide
#     cp aide-forensik.conf /etc/aide/aide.conf      # oder --config beim Aufruf
#     aide --init                                     # Baseline erzeugen
#     mv /var/lib/aide/aide.db.new /var/lib/aide/aide.db
#     aide --check                                    # späterer Abgleich
#
#  wp_plesk_forensik.sh (§8.14) ruft bei vorhandener DB automatisch
#  `aide --check` auf (read-only) und meldet Abweichungen. Es erstellt oder
#  aktualisiert die DB NICHT — das ist bewusst Aufgabe des Administrators
#  (jede DB-Aktualisierung „segnet" den aktuellen Zustand ab).
# ============================================================================

database=file:/var/lib/aide/aide.db
database_out=file:/var/lib/aide/aide.db.new
gzip_dbout=yes
report_url=stdout

# ── Regel-Makros ────────────────────────────────────────────────────────────
# Binaries/Bibliotheken: voller Fingerabdruck inkl. SHA256
Binlib    = p+i+n+u+g+s+b+m+c+sha256
# Konfigdateien: Inhalt + Metadaten, aber ohne atime-Rauschen
ConfFiles = p+i+n+u+g+s+m+c+sha256
# Nur-Existenz/Rechte (für Verzeichnisse, die Inhalt legitim wechseln)
PermsOnly = p+i+u+g

# ── Überwachte Systembereiche (stabil im Normalbetrieb) ─────────────────────
/bin              Binlib
/sbin             Binlib
/usr/bin          Binlib
/usr/sbin         Binlib
/usr/local/bin    Binlib
/usr/local/sbin   Binlib
/lib              Binlib
/lib64            Binlib
/usr/lib          Binlib
/boot             Binlib
/etc              ConfFiles
/root/.ssh        ConfFiles
/etc/cron.d       ConfFiles
/etc/cron.hourly  ConfFiles
/etc/cron.daily   ConfFiles
/etc/cron.weekly  ConfFiles
/etc/cron.monthly ConfFiles
/etc/systemd/system ConfFiles
/etc/init.d       ConfFiles

# ── Ausschlüsse: Kundendaten, volatile & hoch-frequente Pfade ───────────────
# Kundenwebspace bleibt bewusst außen vor (eigener Scan-Scope des Tools):
!/var/www/vhosts
# Volatile / Laufzeit / Caches:
!/var/log
!/var/cache
!/var/tmp
!/tmp
!/proc
!/sys
!/dev
!/run
!/mnt
!/media
# Datenbank-/Panel-Zustände (ändern sich ständig):
!/var/lib/mysql
!/var/lib/psa
!/var/lib/plesk
!/etc/mtab
!/etc/resolv.conf
# Ablage des Forensik-Tools selbst:
!/root/wartungsscripte
