# NT-Forensik — Prüfrezept: Nextcloud
#
# Datendatei, kein Skript. Wird gelesen, nicht ausgeführt — ein Rezept aus
# fremder Hand darf nichts mit Root-Rechten tun können.

name          = Nextcloud
ebene         = website

# ── Erkennung ────────────────────────────────────────────────
# Marker findet Kandidaten, Bestätigung schließt Fehltreffer aus. 'occ' allein
# liegt auch in Sicherungskopien und in Dokumentation; erst zusammen mit
# version.php und apps/ ist es eine Installation.
marker        = occ
marker_tiefe  = 6
bestaetigung  = version.php, apps/

# ── Sicherungskopien ─────────────────────────────────────────
# Der eingebaute Updater legt vollständige Bäume unter updater-<id>/backups/
# ab. Ohne diesen Filter meldete der Abschnitt am 07.08.2026 drei Kopien
# derselben Instanz als drei eigene Installationen.
kopien_regex  = /updater-[a-z0-9]+/backups/|/[a-z0-9_-]*backups?/|/\.?(quarantaene|quarantine|old|bak)/

# ── Falsch-Positiv-Ausnahmen INNERHALB einer gesunden Instanz ─
# Ohne diese Liste meldet die Verschachtelungsprüfung bei jeder intakten
# Nextcloud Funde — und lib/composer/composer zu entfernen erzeugt einen
# Fatal Error.
legitim_regex = /lib/composer/composer/|/3rdparty/phpseclib/phpseclib/phpseclib/|/apps/[^/]+/vendor/

# ── Werkzeug ─────────────────────────────────────────────────
# occ antwortet bei unpassender PHP-Fassung mit einer HTML-Meldung auf STDOUT
# und Rückgabewert 0. Die Probe verlangt deshalb gültiges JSON, nicht bloß
# irgendeine Ausgabe.
werkzeug             = occ
werkzeug_probe       = status --output=json
werkzeug_probe_form  = json

# ── Version ──────────────────────────────────────────────────
version_datei = version.php
version_regex = \$OC_Version *= *array *\( *[0-9,\ ]+
