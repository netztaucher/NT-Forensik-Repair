# NT-Forensik — Prüfrezept: WordPress
#
# Datendatei, kein Skript.

name          = WordPress
ebene         = website

# ── Erkennung ────────────────────────────────────────────────
# Bis v3.13 suchte Abschnitt 11 nur nach wp-config.php, ohne Bestätigung und
# ohne Selbstausschluss. wp-load.php daneben schließt Konfigurationsdateien
# aus, die bei einer Migration liegengeblieben sind.
marker        = wp-config.php
marker_tiefe  = 5
bestaetigung  = wp-load.php

# ── Sicherungskopien ─────────────────────────────────────────
# Abschnitt 11 filterte sie GAR NICHT. Auf einem Host mit Plesk-Backupbäumen
# erzeugte jede Sicherung eigene Befunde; im Prüfstand meldete der Lauf vier
# wp-config.php bei drei echten Installationen.
kopien_regex  = /updater-[a-z0-9]+/backups/|/[a-z0-9_-]*backups?/|/\.?(quarantaene|quarantine|old|bak|alt)/

# ── Falsch-Positiv-Ausnahmen ─────────────────────────────────
# elFinder gehört zu legitimen Datei-Managern und trägt Dateinamen, die wie
# Webshells aussehen. Am 06.08.2026 meldete ein Lauf drei "bösartige Plugins" —
# zwei davon waren diese Bibliothek.
legitim_regex = /elfinder/|/vendor/|/node_modules/

# ── Werkzeug ─────────────────────────────────────────────────
# 'core version' ist die billigste Abfrage, deren Antwort sich prüfen lässt:
# sie muss mit einer Versionsnummer beginnen. Ohne diese Probe galt eine leere
# Ausgabe von verify-checksums als "Kern unverändert".
werkzeug            = wp
werkzeug_extern     = ja
werkzeug_probe      = core version
werkzeug_probe_form = version

# ── Konfiguration und Datenbank ──────────────────────────────
konf_datei     = wp-config.php
konf_muster    = define\(\s*['"]%s['"]\s*,\s*['"]\K[^'"]*
konf_db_name   = DB_NAME
konf_db_user   = DB_USER
konf_db_pass   = DB_PASSWORD
konf_db_host   = DB_HOST
praefix_muster = \$table_prefix\s*=\s*['"]\K[^'"]*
praefix_vorgabe = wp_
