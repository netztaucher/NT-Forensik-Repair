name: Prüfung

# Was diese Prüfung leistet — und was nicht.
#
# Sie leistet: Syntaxprüfung aller Skripte, statische Analyse über shellcheck,
# und den Nachweis, dass zwei Läufe desselben Programmstands dieselbe Ausgabe
# erzeugen (Determinismus).
#
# Sie leistet NICHT den Vergleich gegen die eingecheckte Referenz unter
# pruefstand/referenz/. Diese Referenz stammt von einem macOS-Arbeitsplatz mit
# BSD-Werkzeugen; `find -ls`, `stat` und `sort` verhalten sich dort anders als
# unter GNU/Linux. Ein Vergleich über die Plattformgrenze hinweg würde bei
# jedem Lauf ausschlagen und wäre damit wertlos — er würde den Blick genau auf
# die echten Abweichungen verstellen.
#
# Der Regressionsvergleich ist deshalb ein lokaler Schritt vor jedem Commit:
#   werkzeuge/goldmuster.sh vergleichen
# Weicht etwas ab: prüfen, ob es beabsichtigt war, dann
#   werkzeuge/goldmuster.sh aufnehmen
# und die neue Referenz im selben Commit mitschicken.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    name: Syntax und statische Analyse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash -n über alle Skripte
        run: |
          fehler=0
          while IFS= read -r f; do
            if ! bash -n "$f" 2>/tmp/syn.err; then
              echo "::error file=$f::$(head -3 /tmp/syn.err)"
              fehler=1
            fi
          done < <(git ls-files '*.sh')
          exit $fehler

      - name: python -m py_compile über alle Python-Dateien
        run: |
          fehler=0
          while IFS= read -r f; do
            python3 -m py_compile "$f" || { echo "::error file=$f::Syntaxfehler"; fehler=1; }
          done < <(git ls-files '*.py')
          exit $fehler

      - name: Keine bash-4-Sprachmittel
        # `declare -A` (assoziative Arrays) gibt es erst ab bash 4. macOS
        # liefert bis heute 3.2 aus. Bis v3.11 steckten vier davon in der
        # Befund-Klassifikation — unbemerkt, weil dieser Block an Abschnitt 13
        # hing und der bei --nur-website gar nicht läuft. Beim Verschieben in
        # Abschnitt 14 brach der erste Lauf sofort ab.
        #
        # Der Prüfstand auf dem Entwicklungsrechner ist nur so viel wert, wie er
        # vom Werkzeug erreicht. Diese Stufe hält den Weg dorthin offen.
        run: |
          if git grep -nE '^\s*(local\s+)?declare\s+-A|^\s*typeset\s+-A' -- '*.sh'; then
            echo "::error::bash-4-Sprachmittel gefunden. Auf bash 3.2 (macOS) bricht der Lauf damit ab — und der Prüfstand erreicht die Stelle dort nie."
            exit 1
          fi
          echo "  ok — keine assoziativen Arrays"

      - name: Belegstufen sind vollständig und plausibel (#1)
        # Der Prüfstand läuft mit --nur-website; die Abschnitte der Ebene
        # `system` erzeugen dabei gar keine Belege, und ihre Einstufung wäre
        # von keinem Vergleich gedeckt. Deshalb hier statisch.
        run: |
          fehler=0
          # 1. Jedes Modul, das Belege erhebt, muss seine Stufe benennen.
          #    Ohne Angabe gilt `betreiber` — richtig als Vorgabe, aber als
          #    unausgesprochene Entscheidung wertlos.
          while IFS= read -r m; do
            grep -q 'evidence "' "$m" || continue
            grep -q '^BELEG_STUFE=' "$m" || {
              echo "::error file=$m::Modul erhebt Belege, benennt aber keine BELEG_STUFE (#1)."
              fehler=1
            }
          done < <(git ls-files 'module/*.sh')
          # 2. Ein Abschnitt der Ebene `system` darf nichts als `kunde`
          #    einstufen. Er misst den Server des Betreibers, nicht den
          #    Webauftritt des geprüften Kunden — genau die Verwechslung, aus
          #    der #1 entstanden ist.
          while IFS= read -r m; do
            grep -qE '^# @ebene:[[:space:]]*system' "$m" || continue
            if grep -nE '^BELEG_STUFE=kunde|evidence .* kunde$' "$m"; then
              echo "::error file=$m::Abschnitt der Ebene 'system' stuft einen Beleg als 'kunde' ein (#1)."
              fehler=1
            fi
          done < <(git ls-files 'module/*.sh')
          [[ $fehler -eq 0 ]] && echo "  ok — Belegstufen vollständig und plausibel"
          exit $fehler

      - name: Lizenz-Gate vor dem Wordfence-Bestand (#8)
        # Sobald ein Wordfence-Bestand im öffentlichen Repository liegt, ist er
        # ausgeliefert — die Auflagen gelten ab diesem Augenblick, nicht ab dem
        # nächsten Release. Als Punkt auf einer Merkliste hielte das genau bis
        # zu dem Tag, an dem es eilig ist.
        #
        # Geprüft werden beide Richtungen: die Sperre muss greifen, und eine
        # ausgefüllte LICENSE muss sie öffnen. Eine Sperre, die immer zuschlägt,
        # bestünde einen einseitigen Test genauso — und es entstünde nie ein
        # Bestand.
        run: bash werkzeuge/lizenz-pruefstand.sh

      - name: Selbsttest des Injektionsmasses (7.15)
        # Zwei Richtungen, beide nötig. Ein Mass, das nur "meldet den
        # Schadcode" prüft, wäre durch "meldet immer" zu bestehen — und genau
        # das ist der Fehlerfall, der hier weh tut: minifizierte Dateien,
        # Template-Dateien mit 401 PHP-Öffnern und legitimes eval mitten in
        # einer grossen Klasse müssen SCHWEIGEN.
        run: python3 lib/injektion_pruefen.py --selbsttest

      - name: Selbsttest des Versionsvergleichs
        # Der Abgleich installierter Fassungen gegen Verwundbarkeitsbereiche
        # steht und fällt mit der Ordnung der Versionen. Ist sie an einer
        # Stelle falsch, meldet das Werkzeug entweder eine Lücke, die
        # geschlossen ist, oder schweigt zu einer, die offen ist — beides sieht
        # im Bericht plausibel aus und fällt im Betrieb nicht auf.
        run: python3 lib/wp_schwachstellen.py --selbsttest

      - name: Versionsvergleich gegen PHP
        # Die eigentliche Absicherung: nicht gegen eine handgeschriebene
        # Erwartungstabelle prüfen, sondern gegen die Umsetzung, die WordPress
        # selbst benutzt. 30.000 Fälle je Lauf.
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq php-cli
          bash werkzeuge/version_compare_gegentest.sh 30000

      - name: Selbsttest der WordPress-Härtungsprüfungen (#85)
        # Beide Richtungen: der offene Zustand muss melden, der gehärtete
        # darf nicht. Eine Härtungsprüfung, die immer warnt, wird ignoriert
        # und ist damit wertlos.
        run: bash werkzeuge/haertung_selbsttest.sh

      - name: Selbsttest der Einordnung der 7.15-Rangfolge (#42)
        # 7.15 meldet keinen Befund — sie bestimmt, wohin ein Mensch zuerst
        # sieht. Auf einem Serverlauf lagen 15,8 % ihrer Einträge unter einem
        # Kern, den derselbe Lauf als unverändert bestätigt hatte. Geprüft
        # wird in beide Richtungen: unter geprüftem Kern muss entlastet
        # werden, unter ungeprüftem darf nicht.
        run: bash werkzeuge/injektion_einordnung_selbsttest.sh

      - name: Selbsttest der Doorway-Einstufung (#86)
        # Beide Richtungen: die Core-Sitemap entlastet, ein echter Doorway
        # (viele URLs oder Spam-Muster) bleibt crit. Und ohne Abruf darf nie
        # crit stehen — die Signatur allein ist kein Beweis.
        run: bash werkzeuge/doorway_selbsttest.sh

      - name: Selbsttest der Zeilenenden-Gegenprobe (#84)
        # Beide Richtungen und die Gegenprobe. Ein Filter, der nur "meldet
        # nicht mehr" prüft, wäre durch "meldet nie" zu bestehen — und eine
        # echt veränderte Codedatei muss weiterhin MOD ergeben.
        run: bash werkzeuge/zeilenenden_selbsttest.sh

      - name: Selbsttest der Hub-SSO-Befundklasse (rezept_konfig)
        # Die Klasse entscheidet aus Fassung, SSO-Schalter und Schlüssel-Zustand
        # über crit/warn/ok. Jede Verzweigung für sich ist plausibel, falsch
        # wird erst die Kombination — und die Altfassung 4.11.x führt 'userid'
        # ohne 'enabled', was als "aus" gelesen genau die Instanz freispricht,
        # die ein zweites Mal übernommen wurde.
        run: bash werkzeuge/hub_sso_selbsttest.sh

      - name: Zeitstempel in Belegen (lib/kern.sh)
        # Eigener Prüfstand, weil die Referenz unter pruefstand/referenz/ von
        # den Belegen nur die DATEINAMEN festhält, nicht deren Inhalt. Der
        # Inhalt eines Belegs ist aber genau das, was am Ende getragen werden
        # soll — und war bis hierher von keinem Vergleich gedeckt.
        # Die Gegenproben stecken im Prüfstand selbst: zu jedem "wird
        # gemeldet" gehört dort ein Fall, der NICHT gemeldet werden darf.
        run: bash werkzeuge/kern-pruefstand.sh

      - name: Datei-Inventar über eine Quarantäne hinweg (#25)
        # Eigener Prüfstand, weil die Referenz von den Belegen nur die
        # DATEINAMEN festhält. `00_dateien.tsv` ist ein Beleg — und nicht
        # irgendeiner: er ist die einzige Aufzeichnung, die eine Quarantäne
        # überlebt. Geprüft wird, was er leisten soll, nicht seine Form:
        # eine verschobene Datei muss sich über dev+inode wiedererkennen
        # lassen, und ein Bruch der Kette (Kopie statt Verschiebung) muss
        # sichtbar werden statt still zu bleiben.
        run: bash werkzeuge/inventar-pruefstand.sh

      - name: Urteile von baumscan.sh
        # Eigener Prüfstand, weil goldmuster.sh wp_plesk_forensik.sh prüft und
        # die Urteile in baumscan.sh leben. Und mit Soll-Werten statt
        # Referenzvergleich: bei einem Urteil ist die richtige Antwort vorher
        # bekannt — der Test soll melden, dass etwas FALSCH ist, nicht nur,
        # dass sich etwas geändert hat.
        run: bash werkzeuge/baumscan-pruefstand.sh

      - name: Gegenproben — merkt der Urteils-Prüfstand eine Verschlechterung?
        run: |
          gegenprobe() {   # <name> <variable>
            if env "$2=1" bash werkzeuge/baumscan-pruefstand.sh >/dev/null 2>&1; then
              echo "::error::Der Urteils-Prüfstand ist blind für: $1"
              exit 1
            fi
            echo "  ok — $1 wird bemerkt"
          }
          gegenprobe "fehlender Encoder-Banner"      NT_BAUMSCAN_OHNE_PACKER
          gegenprobe "PHP aus der Mediendatei raus"  NT_BAUMSCAN_OHNE_MEDIENPHP
          gegenprobe "verfälschte Prüfsumme"         NT_BAUMSCAN_OHNE_PRUEFSUMME

      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          # Die Module werden per `source` in den Runner gezogen und sehen
          # dessen Variablen — shellcheck kennt diesen Zusammenhang nicht und
          # meldet sonst jede geerbte Variable als undefiniert (SC2154).
          # SC1091: eingebundene Dateien werden zur Prüfzeit nicht aufgelöst.
          shellcheck --severity=warning --exclude=SC2154,SC1091 \
            $(git ls-files '*.sh') || true
          echo "--- als Fehler gewertet: nur error-Stufe ---"
          shellcheck --severity=error --exclude=SC2154,SC1091 $(git ls-files '*.sh')

  determinismus:
    name: Zwei Läufe, dieselbe Ausgabe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: php-cli
        # Der Pruefbaum enthaelt eine wp-cli-Attrappe. Echtes wp-cli ist ein
        # PHP-Programm, und der Rahmen ruft es als `php <datei>` auf — ohne PHP
        # bricht er nach der Werkzeug-Probe ab und die Kern- sowie
        # Plugin-Integritaet blieben wieder ungeprueft. Ausdruecklich
        # installiert statt auf das Runner-Abbild zu vertrauen.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq php-cli

      - name: Referenz auf dieser Plattform aufnehmen
        run: bash werkzeuge/goldmuster.sh aufnehmen

      - name: Zähler und Listen stimmen überein (#64)
        run: |
          # Diese Zusicherung steht in der CI und nicht im lokalen Prüflauf,
          # weil sie auf macOS nichts prüfen KANN: dort ist BSD-grep die
          # Vorgabe, §7.3 meldet "kein -P (PCRE)" und findet null Treffer.
          # Die eingecheckte Referenz trägt an dieser Stelle deshalb Nullen —
          # eine Gleichheitsprüfung gegen sie liefe gegen 0 == 0.
          #
          # Auf dem Linux-Runner läuft §7.3 wirklich. Erst hier sind die
          # Zahlen belastbar.
          #
          # Geprüft wird, was am 13.08.2026 auf dem echten Server auseinanderlag:
          # metrics.webshell_count nannte 398, actionable.webshell_dropper
          # hatte 292 Einträge. Dieselbe Datei, dieselbe Sache, zwei Zahlen.
          python3 - <<'PY'
          import json, sys, glob
          p = sorted(glob.glob('pruefstand/referenz/betreiber_findings.json'))[0]
          d = json.load(open(p))
          m, a = d['metrics'], d['actionable']
          print(f"webshell_count   {m['webshell_count']:>5}   Liste {len(a['webshell_dropper']):>5}")
          print(f"  roh {m['webshell_count_roh']}  entlastet {m['webshell_entlastet']}")
          print(f"webshell_review  {m['webshell_review']:>5}"
                f"   roh {m['webshell_review_roh']}  entlastet {m['webshell_review_entlastet']}")
          fehler = []
          if m['webshell_count'] != len(a['webshell_dropper']):
              fehler.append('metrics.webshell_count weicht von actionable.webshell_dropper ab')
          # Die Bilanz muss aufgehen. Seit #46 gibt es DREI Toepfe: was uebrig
          # bleibt, was gegen amtliche Pruefsummen entlastet wurde, und was aus
          # einem Abhaengigkeitsverzeichnis stammt. Genau diese Zeile hat
          # gemeldet, dass der dritte Topf eingefuehrt wurde, ohne die
          # Buchhaltung nachzuziehen.
          if m['webshell_count'] + m['webshell_entlastet'] + m['webshell_vendor'] != m['webshell_count_roh']:
              fehler.append(
                  f"webshell: roh {m['webshell_count_roh']} != rest {m['webshell_count']} "
                  f"+ entlastet {m['webshell_entlastet']} + vendor {m['webshell_vendor']}")
          if m['webshell_review'] + m['webshell_review_entlastet'] != m['webshell_review_roh']:
              fehler.append('webshell_review: roh != rest + entlastet')
          # #46 — Fremdbibliotheken gehören NICHT in die Quarantäneliste.
          # NT-Repair zieht seine Kandidaten aus actionable.webshell_dropper
          # (nt_repair.sh:373-383). Auf dem echten Server lagen dort 156 von
          # 292 Einträgen unter vendor/ — eine Bereinigung hätte
          # PDF-Erzeugung, Nextcloud und Less-Kompilierung verschoben.
          # Die Liste hier muss VENDOR_PFADE in lib/konfig.sh entsprechen.
          # 3rdparty/ und libraries/ kamen am 14.08.2026 dazu — 16 Dateien
          # (TCPDF-Schriften, Joomla-Bibliotheken) standen bis dahin in der
          # Quarantäneliste.
          VPFADE = ['/vendor/', '/vendor-prefixed/', '/node_modules/',
                    '/3rdparty/', '/libraries/']
          vend = [p for p in a['webshell_dropper'] if any(v in p for v in VPFADE)]
          # Jeder Pfadtyp braucht eine eigene Fixture, sonst hält der Test für
          # geprüft, was nur mitgelaufen ist: der vendor/-Fall bestünde auch
          # dann, wenn die beiden neuen Einträge in konfig.sh fehlten.
          if m['webshell_count_roh'] > 0:
              for v in ('/vendor/', '/3rdparty/', '/libraries/'):
                  if not any(v in p for p in a['webshell_dropper_vendor']):
                      fehler.append(f'Prüfbaum erzeugt keinen Treffer unter {v} — dieser Pfadtyp ist ungeprüft')
          print(f"webshell_vendor  {m['webshell_vendor']:>5}   "
                f"Liste {len(a['webshell_dropper_vendor']):>5}")
          if vend:
              fehler.append(f'{len(vend)} Fremdbibliotheks-Pfade in webshell_dropper: {vend[:3]}')
          if m['webshell_vendor'] != len(a['webshell_dropper_vendor']):
              fehler.append('metrics.webshell_vendor weicht von der Liste ab')
          if m['webshell_count_roh'] > 0 and m['webshell_vendor'] == 0:
              fehler.append('Prüfbaum erzeugt keinen Fremdbibliotheks-Treffer — die Trennung ist ungeprüft')
          # #-WP_CONFIGS — Rotationsziele und DSGVO-Datenbanken. War nach dem
          # Umzug nach rezepte/ dauerhaft leer; NT-Repair rotierte ins Leere.
          print(f"wp_configs       {len(a['wp_configs']):>5}   "
                f"wp_installs {m['wp_installs']:>5}")
          if len(a['wp_configs']) != m['wp_installs']:
              fehler.append('actionable.wp_configs passt nicht zu metrics.wp_installs')
          # Ein ungeprüfter Kern darf nicht entlasten (#65).
          #
          # Dieselbe Datei liegt unter zwei Kernen: Kunde 3, dessen
          # verify-checksums durchläuft, und Kunde 4, für den wp-cli gar nicht
          # antwortet. Die Entlastung durch 13c/13d hängt am
          # Whitelist-Eintrag, und den bekommt nur, wer nachweislich geprüft
          # WURDE.
          #
          # Warum als Soll-Wert und nicht über den Referenzvergleich: §7.3
          # findet auf macOS null Treffer (BSD-grep kann kein -P). Lokal wäre
          # die Zusicherung leer — beide Dateien fehlen dort, und ein
          # Vergleich 0 == 0 sähe genauso grün aus.
          #
          # Auf kundenserver42 betraf das 12 von 121 Instanzen: der Bericht
          # meldete "Kern unverändert" UND führte eine Kern-Datei als Fund.
          drop = a['webshell_dropper']
          k3 = [p for p in drop if 'kunde-drei' in p and 'class-pruefstand-sanitize' in p]
          k4 = [p for p in drop if 'kunde-vier' in p and 'class-pruefstand-sanitize' in p]
          print(f"ungeprüfter Kern: Kunde 3 (geprüft) {len(k3)} Treffer, "
                f"Kunde 4 (nicht geprüft) {len(k4)} Treffer")
          if m['webshell_count_roh'] > 0:
              if k3:
                  fehler.append('Kern von Kunde 3 IST geprüft — die Datei hätte entlastet werden müssen')
              if not k4:
                  fehler.append('Kern von Kunde 4 wurde NICHT geprüft — die Datei darf nicht entlastet werden')
          # Core-Update-Staging (#103): dieselbe Datei in zwei Stagings.
          # Kunde 3: verify-checksums bestätigt das Staging — muss entlastet
          # werden. Kunde 2: die Datei weicht ab — muss stehenbleiben. Das
          # zweite ist der Test gegen das pauschale Freisprechen von
          # upgrade/: ein Verzeichnisname ist keine Prüfsumme.
          s3 = [p for p in drop if 'kunde-drei' in p and 'class-pruefstand-staging' in p]
          s2 = [p for p in drop if 'kunde-zwei' in p and 'class-pruefstand-staging' in p]
          print(f"Update-Staging: Kunde 3 (bestätigt) {len(s3)} Treffer, "
                f"Kunde 2 (Abweichung) {len(s2)} Treffer")
          if m['webshell_count_roh'] > 0:
              if s3:
                  fehler.append('Staging von Kunde 3 IST bestätigt — die Datei hätte entlastet werden müssen (#103)')
              if not s2:
                  fehler.append('Staging von Kunde 2 weicht ab — die Datei darf nicht entlastet werden (#103)')
          # Bündelpfade ohne vendor/ (#105): die Bibliothek steht im Pfad
          # (lib/packages/setasign/fpdi) — Sichtung. Eigencode unter lib/
          # ohne Bibliotheksnamen — bleibt kritisch. Das zweite ist der Test
          # gegen die Abkürzung, lib/ pauschal aufzunehmen.
          vend = a.get('webshell_dropper_vendor', [])
          lp_v = [p for p in vend if 'lib/packages/setasign/fpdi' in p]
          lp_k = [p for p in drop if 'lib/packages/setasign/fpdi' in p]
          eig  = [p for p in drop if 'class-pruefstand-eigencode' in p]
          print(f"Bündelpfad: fpdi unter lib/packages/ Sichtung {len(lp_v)} kritisch {len(lp_k)}, "
                f"Eigencode unter lib/ kritisch {len(eig)}")
          if m['webshell_count_roh'] > 0:
              if not lp_v or lp_k:
                  fehler.append('fpdi unter lib/packages/ gehört in die Sichtung, nicht in die kritische Stufe (#105)')
              if not eig:
                  fehler.append('Eigencode unter lib/ wurde abgeschichtet — lib/ ist kein Bibliotheksname (#105)')
          # Gemischter Kern (#107): eine Core-Abweichung, die bytegleich im
          # bestätigten Staging liegt, ist die Datei der neuen Fassung nach
          # einem abgebrochenen Update — warn, nicht crit. Eine ohne
          # Staging-Kopie (load.php) bleibt crit. Beide in Kunde 2.
          kern = d.get('befunde', {}).get('wordpress', {}).get('kern', [])
          gem = [b for b in kern if 'kunde-zwei' in b.get('text', '') and 'gemischt' in b.get('text', '')]
          ver = [b for b in kern if 'kunde-zwei' in b.get('text', '') and 'veränderte Core-Datei' in b.get('text', '')]
          print(f"gemischter Kern: warn {len(gem)} (schwere {[g['schwere'] for g in gem]}), "
                f"echte Abweichung {len(ver)} (schwere {[v['schwere'] for v in ver]})")
          if not gem or any(g['schwere'] != 'warn' for g in gem):
              fehler.append('Datei aus dem bestätigten Staging wurde nicht als gemischter Kern (warn) eingeordnet (#107)')
          if not ver or any(v['schwere'] != 'crit' for v in ver):
              fehler.append('echte Core-Abweichung ohne Staging-Kopie ist nicht mehr crit (#107)')
          if not any('1 veränderte' in v.get('text', '') for v in ver):
              fehler.append('die Zahl der echten Abweichungen muss 1 sein — die gemischte Datei darf nicht mitgezählt werden (#107)')
          # 7.2 — die Abschichtung darf den Ort nicht mit dem Format
          # verwechseln (#65). Die getarnte Shell LIEGT im WPML-Cache, sieht
          # aber nicht wie ein Twig-Template aus: sie gehört in die
          # Quarantäneliste, nicht in die Sichtung.
          erz = a.get('php_in_uploads_erzeugt', [])
          upl = a.get('php_in_uploads', [])
          print(f"php_in_uploads   {len(upl):>5}   erzeugt {len(erz):>5}")
          if not any('getarnt.php' in e.get('pfad','') for e in erz) \
             and not any('getarnt.php' in p for p in upl):
              fehler.append('Prüfbaum erzeugt keine getarnte Datei im Cache-Verzeichnis — die Abschichtung ist ungeprüft')
          if any('getarnt.php' in e.get('pfad','') for e in erz):
              fehler.append('getarnt.php wurde abgeschichtet, obwohl sie das Format nicht trägt — Ortsregel statt Formatregel')
          for _erw in ('WPML', 'TCPDF', '__halt_compiler'):
              if not any(_erw in e.get('eintrag','') for e in erz):
                  fehler.append(f'kein abgeschichteter Treffer vom Typ {_erw} — dieser Erzeuger ist ungeprüft')
          # Gründerkonten gehören NICHT in die Bereinigung (#65).
          #
          # Der Prüfbaum liefert drei kürzlich angelegte Administratoren:
          # `gruender` ohne älteren Benutzer (hat die Installation eröffnet),
          # `wp_backup` und `svc_updater` mit älteren Benutzern.
          #
          # Warum als Soll-Wert und nicht über den Referenzvergleich: auf
          # macOS fehlt grep -P, die Zugangsdaten aus wp-config.php sind nicht
          # lesbar, und der GANZE Datenbankzweig bricht vorher ab (#67). Die
          # eingecheckte Referenz trägt an dieser Stelle leere Listen — ein
          # Vergleich liefe gegen [] == [].
          #
          # Auf kundenserver42 hätte die Bereinigung sonst auf zwei laufenden
          # Kundenseiten den EINZIGEN Administrator ausgesperrt: `moorth` war
          # dort jeweils Benutzer ID 1, und die Seite war genauso jung wie das
          # Konto.
          rog = {x['benutzer'] for x in a.get('rogue_wp_admins_detail', [])}
          gru = {x['benutzer'] for x in a.get('wp_gruender_admins', [])}
          print(f"Admins: rogue={sorted(rog)}  gruender={sorted(gru)}")
          if not rog and not gru:
              fehler.append('Prüfbaum liefert gar keine kürzlich angelegten Admins — der Zweig ist ungeprüft')
          else:
              if 'gruender' in rog:
                  fehler.append('Gründerkonto steht in rogue_wp_admins_detail — die Bereinigung würde es deaktivieren')
              if 'gruender' not in gru:
                  fehler.append('Gründerkonto fehlt in wp_gruender_admins — es verschwindet still statt sichtbar zu bleiben')
              for _n in ('wp_backup', 'svc_updater'):
                  if _n not in rog:
                      fehler.append(f'{_n} fehlt in rogue_wp_admins_detail — der Wächter entlastet zu viel')
          if m['webshell_count_roh'] == 0:
              # Kein Abbruch: ob der Prüfbaum auf dieser Plattform überhaupt
              # Mustertreffer erzeugt, ist eine eigene Frage. Aber sie muss
              # sichtbar sein — sonst hält eine Zusicherung, die gegen Nullen
              # läuft, für eine Prüfung.
              print('HINWEIS: 0 Mustertreffer — die Gleichheit oben ist trivial erfüllt.')
          for f in fehler:
              print(f'FEHLER: {f}', file=sys.stderr)
          sys.exit(1 if fehler else 0)
          PY

      - name: Zweimal vergleichen
        run: |
          # Zweimal, weil eine einzelne Wiederholung eine Instabilität
          # verdecken kann, die nur gelegentlich auftritt.
          bash werkzeuge/goldmuster.sh vergleichen
          bash werkzeuge/goldmuster.sh vergleichen

      - name: Gegenprobe — schlägt der Prüfstand bei einer echten Änderung an?
        run: |
          # Ein Prüfstand, der nie ausschlägt, ist keiner. Diese Stufe schaltet
          # den Kopienfilter des Nextcloud-Rezepts ab und erwartet, dass der
          # Vergleich das bemerkt. Am 07.08.2026 tat er das nicht — die
          # Sicherungskopie im Prüfbaum lag tiefer als das -maxdepth der
          # Erkennung und wurde nie gefunden.
          ZIEL=rezepte/nextcloud/rezept.conf
          cp "$ZIEL" /tmp/rezept.sicherung
          perl -i -pe "s/^kopien_regex.*/kopien_regex = TRIFFT-NICHTS/" "$ZIEL"
          if bash werkzeuge/goldmuster.sh vergleichen >/dev/null 2>&1; then
            echo "::error::Der Prüfstand ist blind für eine abgeschaltete Prüfung."
            cp /tmp/rezept.sicherung "$ZIEL"
            exit 1
          fi
          cp /tmp/rezept.sicherung "$ZIEL"
          bash werkzeuge/goldmuster.sh vergleichen

      - name: Gegenproben — erreicht der Prüfstand die WordPress-Prüfungen?
        run: |
          # Ein Prüfstand, der eine Prüfung nicht erreicht, behauptet Abdeckung,
          # die es nicht gibt. Jede Stufe schaltet GENAU EINE Quelle ab und
          # erwartet, dass der Vergleich es bemerkt.
          gegenprobe() {   # <name> <variable=wert>
            if env "$2" bash werkzeuge/goldmuster.sh vergleichen >/dev/null 2>&1; then
              echo "::error::Der Prüfstand erreicht $1 nicht."
              exit 1
            fi
            echo "  ok — $1 wird erreicht"
          }
          gegenprobe "den Schwachstellenabgleich"  WP_DATEN_MAX_TAGE=-1

      - name: Umbenanntes plugins-Verzeichnis erzeugt keine Leichen (#65)
        run: |
          # Soll-Wert statt Referenzvergleich. Ein blosses "der Vergleich
          # schlägt aus" wäre hier wertlos: das Umbenennen ändert den Bericht
          # ohnehin an einem Dutzend Stellen. Geprüft wird, WAS dasteht.
          #
          # Auf kundenserver42 stammten 18 der 37 gemeldeten Plugin-Leichen
          # daher, dass jemand plugins/ nach plugins-old umbenannt hatte —
          # ein maximaler Befund aus einem fehlenden Verzeichnis.
          env NT_PRUEFSTAND_OHNE_PLUGINDIR=1 \
            bash werkzeuge/goldmuster.sh vergleichen >/dev/null 2>&1 || true
          B="${HOME}/.nt-goldmuster/lauf/neu/betreiber_technik_bericht.md"
          [[ -f "$B" ]] || { echo "::error::Gegenprobe hat keinen Bericht hinterlassen: $B"; exit 1; }
          fehler=0
          grep -q "wp-content/plugins fehlt" "$B" || {
            echo "::error::Kein ⚪ für das fehlende plugins-Verzeichnis — e1 hält den Ausfall für ein Ergebnis."
            fehler=1; }
          grep -q "plugins-old" "$B" || {
            echo "::error::Der Hinweis auf das umbenannte Verzeichnis fehlt."
            fehler=1; }
          if grep -q "active_plugins führt Einträge ohne Datei" "$B"; then
            echo "::error::e1 meldet Leichen, obwohl das plugins-Verzeichnis fehlt — genau der Fehlalarm von kundenserver42."
            fehler=1
          fi
          [[ $fehler -eq 0 ]] && echo "  ok — fehlendes plugins-Verzeichnis wird als ⚪ geführt, nicht als Befund"
          exit $fehler
          gegenprobe "den Datenbestand"            WP_DATEN_DIR=/nicht/vorhanden
          gegenprobe "die Plugin-Prüfsummen"       WP_PRUEFSUMMEN_BASIS=/nicht/vorhanden
          # 7.13 trägt einen Befund, den KEINE andere Prüfung erhebt: ein
          # gültiges PNG mit völlig unverschleiertem PHP darin — kein eval,
          # kein base64, keine Superglobale. Der Prüfbaum enthält zwar eine
          # zweite getarnte Nutzlast, die aber system($_GET[…]) nutzt und
          # deshalb auch bei den Musterprüfungen anschlägt; sie taugt als
          # Nachweis für 7.13 nicht. Ohne die isolierende Probe muss der
          # Vergleich ausschlagen, sonst ist der Abschnitt blind.
          gegenprobe "7.13 PHP-in-Mediendateien"   NT_PRUEFSTAND_OHNE_MEDIENPROBE=1
          # Die zweite Musterstufe: gefährliche Funktionen ohne jede
          # Obfuskation in einer kleinen Datei. Fällt durch PATTERN_REGEX.
          gegenprobe "7.3 zweite Musterstufe"      NT_PRUEFSTAND_OHNE_FUNKTIONSPROBE=1
          # .htaccess, die genau eine PHP-Datei freigibt — der Marker, mit dem
          # ein Angreifer seine Shell erreichbar hält und Mitbewerber aussperrt.
          gegenprobe "7.6 Einzelfreigabe in .htaccess" NT_PRUEFSTAND_OHNE_HTACCESSPROBE=1
          # Flächige Zeitstempel-Manipulation.
          gegenprobe "7.14 Zeitstempel-Häufung"    NT_PRUEFSTAND_OHNE_ZEITCLUSTER=1
          # Der Wächter-Filter in 7.2. Ohne diese Probe stehen an den drei
          # Stellen echte PHP-Dateien statt leerer Wächter — sie MÜSSEN dann
          # als Fund erscheinen. Schlägt der Vergleich nicht aus, filtert der
          # Wächter-Zweig nicht mehr nur Wächter, sondern deckt Funde zu.
          # Der umgekehrte Fehler ist gemessen: ein Lauf über 68
          # Installationen meldete 274 leere index.php als "extrem verdächtig".
          gegenprobe "7.2 Wächter-Filter"          NT_PRUEFSTAND_OHNE_WAECHTER=1
          # Die lebende Prüfsummen-Whitelist in 13c. Ohne sie stehen die
          # bestätigt unveränderten Bibliotheks- und Kerndateien wieder in der
          # Trefferliste — der Vergleich MUSS das bemerken.
          gegenprobe "13c Prüfsummen-Whitelist"    NT_PRUEFSTAND_OHNE_PMF_WHITELIST=1
          # Die Wordfence-Auswertung (#17). Ohne den vorgefertigten Bestand
          # fallen sechs Befunde weg — darunter `skippedPaths`, der genau die
          # falsche Entwarnung verhindert, um die es in dem Issue geht.
          gegenprobe "#17 Wordfence-Auswertung"    NT_WF_ATTRAPPE=
          # Der Composer-Abgleich (#14). Ohne Bestand erhebt das Rezept die
          # Abhängigkeiten gar nicht — der Befund fällt weg.
          gegenprobe "#14 Composer-Abgleich"       NT_PRUEFSTAND_OHNE_COMPOSER=1
          # 7.15. Ohne die Nutzlast bleiben die grossen Dateien im Prüfbaum
          # unauffällig — der Vergleich MUSS das bemerken.
          gegenprobe "7.15 Injektion in grossen Dateien" NT_PRUEFSTAND_OHNE_INJEKTION=1
          # 13e.2. Ohne die beiden Stempel tragen alle belasteten Dateien
          # mtime == ctime; der Abschnitt sieht dann nur ANKER und meldet
          # weder eine später geänderte Inode noch eine vorwärts datierte mtime.
          gegenprobe "13e.2 Zeitstempel-Deutung"   NT_PRUEFSTAND_OHNE_ZEITDEUTUNG=1
          # 13e.1. Ohne die festgelegte ctime-Folge liegen alle Funde in
          # derselben Sekunde — es gibt keine Chronologie und keine Welle mehr.
          gegenprobe "13e.1 Zeitachse"             NT_PRUEFSTAND_OHNE_ZEITFOLGE=1
          # 12r e1–e3. Ohne die Probe traegt die Attrappe eine saubere
          # active_plugins und keine Optionsauszuege — Leiche, PHP-Option und
          # Groessenrangfolge verschwinden aus dem Bericht.
          gegenprobe "12r Persistenz in der Datenbank" NT_PRUEFSTAND_OHNE_DBPROBE=1
          # #39. Mit Plugin-Kopf sind die beiden Verzeichnisse echte Plugins:
          # die neuen Zeilen verschwinden und sie zählen wieder in der
          # Angreifbarkeitsbilanz mit. Prüft das Kriterium, nicht die Fixture.
          gegenprobe "12r Verzeichnis ohne Plugin-Kopf" NT_PRUEFSTAND_OHNE_NICHTPLUGIN=1
          # #65. Dieselben fünf Dateien in derselben Sekunde — einmal mit
          # erhaltener alter mtime (Wiederherstellung, eine Sammelzeile), einmal
          # frisch geschrieben (Angreifer, fünf Einzelzeilen). Geprüft wird der
          # UNTERSCHEIDER, nicht ob die Dateien da sind.
          gegenprobe "13e.1 Massenvorgang"         NT_PRUEFSTAND_OHNE_MASSENVORGANG=1
          # #46. Dieselbe Datei mit demselben Muster, einmal unter vendor/ und
          # einmal daneben. Geprüft wird die Trennung, nicht die Anwesenheit.
          gegenprobe "13d Fremdbibliotheken"       NT_PRUEFSTAND_OHNE_VENDORFILTER=1
          # 7.16. Ohne die Zerlegung steht der Funktionsname ausgeschrieben da —
          # dann darf die Regel NICHT mehr anschlagen. Die Textverkettung
          # daneben bleibt in beiden Fällen stumm; sie ist die Gegenprobe
          # gegen eine Regel, die jede Sprachdatei meldet.
          gegenprobe "7.16 zerlegte Funktionsnamen" NT_PRUEFSTAND_OHNE_ZERLEGT=1
          # 7.2. Der Schalter gibt der getarnten Shell den Twig-Kopf. Sie
          # rutscht dann in die Sichtungsstufe — der Vergleich muss das sehen.
          # Ohne diese Gegenprobe wäre die Abschichtung durch "schichtet immer
          # ab" zu bestehen, und das ist genau der teure Fehler.
          gegenprobe "7.2 Erzeuger-Abschichtung"   NT_PRUEFSTAND_OHNE_ERZEUGERFILTER=1
          # #55. Setzt den beim Start festgehaltenen Programmstand auf eine
          # Marke, die kein Hash sein kann. Abschnitt 14 MUSS das bemerken und
          # die Fassungsangabe für ungültig erklären.
          gegenprobe "14 Programmstand-Wechsel"    NT_PRUEFSTAND_STAND_WECHSEL=1
          bash werkzeuge/goldmuster.sh vergleichen

      - name: Abnahmekriterium 7.15 — injiziert meldet, sauber schweigt
        run: |
          # Der Referenzvergleich allein prüft das NICHT: er meldet nur, ob
          # sich etwas geändert hat. Eine Referenz, in der auch die saubere
          # Datei steht, gilt ihm als "unverändert" — sie hielte das
          # Scheitern fest statt es zu melden.
          #
          # Beide Dateien sind gleich gross und gleich gebaut und
          # unterscheiden sich nur um die angehängte Nutzlast. Damit ist das
          # hier eine Aussage über das Mass und nicht über den Prüfbaum.
          #
          # Die Rangfolge steht seit #42 in 13d, nicht mehr in 7.15: 7.15
          # laeuft vor 12r und kann die Pruefsummen-Whitelist nicht kennen.
          # Der Abschnitt hier folgt der Ausgabe dorthin — sonst prueft er
          # eine Ueberschrift, unter der nur noch die Uebergabezeile steht,
          # und faellt still durch.
          B=pruefstand/referenz/betreiber_technik_bericht.md
          A=$(awk '/^### 13d /{s=1} /^### 13e|^## /{if(s)exit} s' "$B")
          if ! grep -q 'gross-injiziert\.php' <<<"$A"; then
            echo "::error::7.15 meldet die injizierte Datei nicht."
            printf '%s\n' "$A" | head -20; exit 1
          fi
          if grep -q 'gross-sauber\.php' <<<"$A"; then
            echo "::error::7.15 meldet auch die saubere Datei gleicher Grösse — das Mass trennt nicht."
            printf '%s\n' "$A" | head -20; exit 1
          fi
          N=$(grep -c 'gross-injiziert\.php' <<<"$A")
          echo "  ok — ${N} injizierte Datei(en) gemeldet, keine saubere"

      - name: Abnahmekriterium #18 — Schadcode unter den ersten fünf
        run: |
          # Das Kriterium steht wörtlich in Issue #18: "der gepackte Webshell
          # muss unter den ersten fünf stehen. Steht er weiter auf Platz 11,
          # hat die Änderung ihr Ziel verfehlt."
          #
          # Der Referenzvergleich allein prüft das NICHT: er meldet nur, ob
          # sich etwas geändert hat. Eine Referenz, die den Schadcode auf
          # Platz 11 festhält, gilt ihm als "unverändert" — sie hielte das
          # Scheitern fest statt es zu melden.
          rm -rf /tmp/nt-18 /tmp/nt-18-ref
          NT_GOLDMUSTER_DIR=/tmp/nt-18 NT_GOLDMUSTER_REF=/tmp/nt-18-ref \
            bash werkzeuge/goldmuster.sh aufnehmen >/dev/null
          RANG=/tmp/rang.txt
          # Ab der 13c-Ueberschrift bis zum Ende des Abschnitts. Ein sed-Bereich
          # auf die Code-Zaeune hin endet am OEFFNENDEN ``` und liefert nichts.
          awk '/^## 13c\./{s=1} /^## 14\./{s=0} s && /Regel\(n\):/' \
            /tmp/nt-18-ref/betreiber_technik_bericht.md > "$RANG" || true
          if [[ ! -s "$RANG" ]]; then
            echo "::error::13c hat keine Rangliste erzeugt — die Prüfstand-Attrappe greift nicht."
            exit 1
          fi
          PLATZ=$(grep -n 'uploads/2026/03/bild.php' "$RANG" | head -1 | cut -d: -f1)
          if [[ -z "$PLATZ" ]]; then
            echo "::error::Der eingebaute Schadcode steht gar nicht mehr in der Liste — der Filter nimmt zuviel weg."
            sed 's/^/    /' "$RANG"; exit 1
          fi
          if [[ "$PLATZ" -gt 5 ]]; then
            echo "::error::Schadcode auf Platz ${PLATZ} statt unter den ersten fünf (#18)."
            sed 's/^/    /' "$RANG"; exit 1
          fi
          # Ein Filter, der 359 Treffer auf 0 senkt, ist kaputt, nicht gut.
          # Beide Richtungen gehören geprüft.
          WEG=$(grep -oE '\(([0-9]+) als unverändert' /tmp/nt-18-ref/betreiber_technik_bericht.md \
                | head -1 | grep -oE '[0-9]+' || echo 0)
          if [[ "${WEG:-0}" -lt 1 ]]; then
            echo "::error::Der Filter hat nichts herausgenommen — die Whitelist erreicht 13c nicht."
            exit 1
          fi
          echo "  ok — Schadcode auf Platz ${PLATZ}, ${WEG} bestätigte Datei(en) herausgefiltert"

      - name: Was das Kundenpaket zurückhält (#4)
        # Eigener Prüfstand, weil goldmuster.sh den LAUF vergleicht und das
        # Paket danach aus einem anderen Werkzeug entsteht. Und weil der
        # Prüfbaum mit --nur-website läuft: er erzeugt ausschliesslich Belege
        # der Stufe `kunde`, ein Fehler in der Aussortierung von `server` und
        # `betreiber` wäre also unsichtbar — in der Richtung, die weh tut.
        # Der Prüfstand ergänzt den echten Lauf deshalb um je einen künstlichen
        # Beleg beider Stufen und prüft, dass sie draussen bleiben.
        run: bash werkzeuge/kundenpaket-pruefstand.sh

      - name: Nachweis — Plugin-Prüfsummen laufen ohne wp-cli (#10)
        run: |
          # Keine Gegenprobe, sondern eine Behauptung über ANWESENHEIT. Der
          # Referenzvergleich taugt hier nicht: ein Lauf ohne wp-cli weicht
          # ohnehin an hundert Stellen ab, und "es hat sich etwas geändert"
          # beantwortet die Frage nicht, ob die Prüfsummen noch laufen.
          #
          # Eigene Referenzablage über NT_GOLDMUSTER_REF, damit dieser Lauf die
          # eingecheckte Referenz nicht überschreibt und der Schritt nicht
          # davon abhängt, der letzte im Auftrag zu sein.
          rm -rf /tmp/nt-owc /tmp/nt-owc-ref
          NT_GOLDMUSTER_DIR=/tmp/nt-owc \
          NT_GOLDMUSTER_REF=/tmp/nt-owc-ref \
          NT_PRUEFSTAND_OHNE_WPCLI=1 \
            bash werkzeuge/goldmuster.sh aufnehmen
          K=/tmp/nt-owc-ref/konsole.txt
          # Erst nachweisen, dass wp-cli wirklich fehlt — sonst bestünde der
          # Test auch dann, wenn die Attrappe stillschweigend doch gebaut wird.
          if ! grep -q "nicht ausführbar" "$K"; then
            echo "::error::Der Lauf hatte wp-cli offenbar doch — die Probe misst nichts."
            exit 1
          fi
          if ! grep -q "wordpress.org" "$K"; then
            echo "::error::Ohne wp-cli fallen die Plugin-Prüfsummen weg. Der Aufruf gehört in rezept_sonder, nicht in rezept_kern (#10)."
            exit 1
          fi
          echo "  ok — Plugin-Prüfsummen erscheinen auch ohne wp-cli"
